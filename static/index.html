<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引导学习 Agent · 现电</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="logo">🧭 引导学习 Agent<small>现代电子学实验 · 三极管放大电路</small></div>
    <span class="statuspill" id="statusPill">AI 老师：检测中…</span>
    <nav class="mainnav">
      <a href="#/course" data-nav="course">课程</a>
      <a href="#/chat" data-nav="chat">问老师</a>
      <a href="#/profile" data-nav="profile">我的画像</a>
    </nav>
  </div>
  <div class="namebar">
    <span>我叫</span><input id="student" value="ark" maxlength="40">
    <span>换个名字 = 换一份学习记录；进度保存在这台服务器上。</span>
  </div>
</header>

<main>
  <!-- 课程页 -->
  <section class="view" id="view-course">
    <div class="hero">
      <h1 id="courseTitle">三极管放大电路</h1>
      <p>规矩不变：先诊断、再引导练习、最后无提示独立测验——测验过了才算真掌握。不直接给答案，是为了让你真的学会。</p>
      <div class="bar"><i id="courseBar" style="width:0%"></i></div>
      <div class="bar-meta" id="courseBarMeta">正在读取进度…</div>
    </div>
    <div class="nexttip" id="nextTip" style="display:none"></div>
    <div class="concept-grid" id="conceptGrid"></div>
  </section>

  <!-- 学习页 -->
  <section class="view" id="view-study">
    <div class="crumb"><a href="#/course">← 返回课程</a></div>
    <div class="study-head">
      <h2 id="studyTitle">知识点</h2>
      <p id="studyGoal"></p>
      <div class="steps" id="stageSteps">
        <span data-stage="diagnose">1 · 摸底诊断</span>
        <span data-stage="guided">2 · 引导练习</span>
        <span data-stage="test">3 · 独立测验</span>
      </div>
    </div>
    <div class="qcard" id="qcard"></div>
  </section>

  <!-- 问老师页 -->
  <section class="view" id="view-chat">
    <div class="diag" id="chatDiag" style="display:none"></div>
    <div class="chatwrap">
      <div class="chatlog" id="chatlog"></div>
      <div class="chatbar">
        <input id="chatin" placeholder="有问题直接问，比如：为什么 Re 能稳定工作点？">
        <button class="btn" id="chatsend">发送</button>
      </div>
    </div>
  </section>

  <!-- 我的画像页 -->
  <section class="view" id="view-profile">
    <div id="profileBody"><p class="empty">正在读取…</p></div>
  </section>
</main>

<footer>教学决策全部由可解释的规则引擎完成并留痕；大模型只在自由提问和开放题判读时参与。学习记录仅保存在本地服务器。</footer>
<script src="/static/app.js"></script>
</body>
</html>
