<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引导式学习 Agent · 现电 · 三极管放大电路</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>引导式学习 Agent</h1>
  <p class="sub">现电 · 三极管放大电路 — 一位有耐心、懂你的老师，一步步带你学</p>
  <label class="student-box">我是 <input id="student" value="ark" maxlength="40"></label>
</header>
<nav id="tabs">
  <button data-tab="learn" class="tab active">课程学习</button>
  <button data-tab="chat" class="tab">问老师</button>
  <button data-tab="profile" class="tab">我的画像</button>
</nav>

<section id="tab-learn" class="tabpage">
  <main>
    <aside id="map">
      <h2>知识地图</h2>
      <div id="concepts"></div>
      <div id="recommend" class="recommend hidden"></div>
    </aside>
    <section id="panel">
      <div id="chatlog"></div>
      <div id="question-box" class="hidden">
        <div class="q-head"><span id="stage-label"></span>
          <label class="conf">答题前信心：
            <select id="confidence">
              <option value="">不填</option>
              <option value="1">1 完全没把握</option>
              <option value="2">2 有点没底</option>
              <option value="3">3 一般</option>
              <option value="4">4 比较有把握</option>
              <option value="5">5 非常确定</option>
            </select>
          </label>
        </div>
        <p id="question-text"></p>
        <div id="options"></div>
        <div id="text-answer" class="hidden">
          <input id="numeric-input" class="hidden" type="text" inputmode="decimal" placeholder="输入数值">
          <textarea id="explain-input" class="hidden" rows="3" placeholder="用自己的话写下你的思路…"></textarea>
          <span id="unit-label"></span>
          <button id="submit-text" type="button">提交</button>
        </div>
        <div class="q-actions">
          <button id="hint-btn" type="button">给我一个提示</button>
          <span id="hint-note" class="muted"></span>
        </div>
        <div id="hint-box" class="hidden"></div>
      </div>
      <div id="empty" class="muted">← 在左边选择一个知识点，开始一次引导学习。</div>
    </section>
  </main>
</section>

<section id="tab-chat" class="tabpage hidden">
  <div id="teacher-chat"></div>
  <div class="chat-input-row">
    <input id="teacher-input" type="text" placeholder="有什么不懂的，问老师…（例如：为什么 Re 能稳定工作点？）">
    <button id="teacher-send" type="button">发送</button>
  </div>
  <p class="muted">老师会先引导你想一步，不会直接把答案甩给你。她记得你反复错的地方。</p>
</section>

<section id="tab-profile" class="tabpage hidden">
  <div id="profile-box" class="muted">正在加载你的学习画像…</div>
</section>

<script src="/static/app.js"></script>
</body>
</html>
